name: CI

# Push su develop + tutte le pull request. Niente run al push su main: con la protezione del
# branch ci si arriva solo da una PR, che ha già controllato lo stesso codice.
on:
  push:
    branches: [develop]
    # Solo sui push: sulle PR il controllo è obbligatorio per il merge su main, quindi deve
    # girare sempre (un controllo saltato resterebbe "in attesa" e bloccherebbe la PR).
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test, build, e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Niente container Playwright: misurato il 2026-11-04, l'immagine costa ~33 s
    # contro i ~15 s dell'installazione di Chromium.
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm test

      - run: pnpm build

      - run: pnpm exec playwright install --with-deps chromium

      - run: pnpm test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
