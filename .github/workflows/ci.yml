name: CI

# Pushes to develop and every pull request. No run on pushes to main: branch protection only
# lets code in through a PR, which has already checked the same code.
on:
  push:
    branches: [develop]
    # Pushes only: on PRs the check is required to merge into main, so it must always run
    # (a skipped check would stay "pending" and block the PR).
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test, build, e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # No Playwright container: measured on 2026-11-04, the image costs ~33 s
    # against ~15 s to install Chromium.
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm test

      - run: pnpm build

      # Without --with-deps: the runner image already has the libraries Chromium needs (it
      # ships Google Chrome), and their apt install failed whenever the Ubuntu mirrors did
      # not answer (2026-11-11).
      - run: pnpm exec playwright install chromium

      - run: pnpm test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
